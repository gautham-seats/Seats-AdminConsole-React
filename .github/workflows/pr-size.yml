name: Pull request size

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label oversized pull requests
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Count changed lines outside lockfiles and generated files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          changed=$(gh api "repos/$REPO/pulls/$PR/files?per_page=100" --paginate \
            --jq '[.[] | select(.filename | test("package-lock.json$|\.snap$") | not) | .additions + .deletions] | add // 0')
          echo "Changed lines: $changed" >> "$GITHUB_STEP_SUMMARY"
          if [ "$changed" -gt 600 ]; then
            gh pr edit "$PR" --repo "$REPO" --add-label needs-split
            echo "::warning::This pull request changes $changed lines; split it so a reviewer can read it in one sitting."
          else
            gh pr edit "$PR" --repo "$REPO" --remove-label needs-split 2>/dev/null || true
          fi
