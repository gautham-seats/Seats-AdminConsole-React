name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Explicit bash adds pipefail, so a failing command piped into tee still fails its step.
defaults:
  run:
    shell: bash

jobs:
  check:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    env:
      # Compiled into the bundle; next.config.ts refuses a production build without it.
      ADMIN_ALLOW_WRITES: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:types
      - run: npm run lint:deps
      - run: npm run lint:dead
      - run: npm test -- --coverage --coverageReporters=text-summary --coverageReporters=text | tee coverage.txt
      - name: Coverage summary
        if: always()
        run: |
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -A4 'Coverage summary' coverage.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build | tee build.txt
      - run: npm run lint:budget | tee -a build.txt
      - run: npm run lint:tokens | tee -a build.txt
      - name: Bundle summary
        run: |
          echo '## Routes and bundle sizes' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed -n '/Route (app)/,/^$/p' build.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  secrets-scan:
    name: Secret scan
    if: github.actor != 'dependabot[bot]' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The CLI needs no licence; gitleaks-action requires one on organisation repos.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks git --redact --no-banner .

  semgrep:
    name: Static security analysis
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pipx install semgrep==1.177.0
      - run: semgrep scan --config p/javascript --config p/typescript --config p/react --config p/nodejs --config p/secrets --error --metrics=off .
