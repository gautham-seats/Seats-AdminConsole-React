name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Explicit bash adds pipefail, so a failing command piped into tee still fails its step.
defaults:
  run:
    shell: bash

jobs:
  check:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    env:
      # Compiled into the bundle; next.config.ts refuses a production build without it.
      ADMIN_ALLOW_WRITES: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:types
      - run: npm run lint:deps
      - run: npm run lint:dead
      - run: npm test -- --coverage --coverageReporters=text-summary --coverageReporters=text | tee coverage.txt
      - name: Coverage summary
        if: always()
        run: |
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -A4 'Coverage summary' coverage.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build | tee build.txt
      - run: npm run lint:budget | tee -a build.txt
      - run: npm run lint:tokens | tee -a build.txt
      - name: Bundle summary
        run: |
          echo '## Routes and bundle sizes' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed -n '/Route (app)/,/^$/p' build.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  secrets-scan:
    name: Secret scan
    # A brand-new branch has no "before" commit, which gitleaks-action cannot scan; PRs and main always have one.
    if: github.actor != 'dependabot[bot]' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Static security analysis
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pipx install semgrep==1.177.0
      - run: semgrep scan --config p/javascript --config p/typescript --config p/react --config p/nodejs --config p/secrets --error --metrics=off .
