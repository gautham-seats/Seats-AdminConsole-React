name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  bundle:
    name: Build and attach the bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ADMIN_ALLOW_WRITES: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package the read-only bundle
        run: tar -czf "seats-admin-console-${GITHUB_REF_NAME}-readonly.tar.gz" .next package.json package-lock.json next.config.ts
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: seats-admin-console-*.tar.gz
          generate_release_notes: true
